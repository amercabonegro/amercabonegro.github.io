<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Solid squares and gaps land on whole pixels at 16px, keeping the navigation
       mark recognizable at tab size without relying on tiny text or thin strokes. -->
  <g fill="#426a49">
    <rect x="4" y="4" width="10" height="10"/>
    <rect x="18" y="4" width="10" height="10"/>
    <rect x="4" y="18" width="10" height="10"/>
    <rect x="18" y="18" width="10" height="10"/>
  </g>
</svg>
